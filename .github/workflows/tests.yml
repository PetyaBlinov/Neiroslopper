name: Windows tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check optional voice libraries on Python 3.12
        if: matrix.python-version == '3.12'
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-voice.txt

      - name: Check optional image libraries on Python 3.12
        if: matrix.python-version == '3.12'
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-camera.txt

      - name: Check Tk availability
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Run simulator, desktop and localhost tests
        run: python -m unittest discover -s tests -v
