name: Experimental Wi-Fi Bluetooth DWIN firmware

on:
  push:
    branches: [feature/fluidnc-bluetooth]
    paths:
      - 'firmware/jd_wifibt/**'
      - '.github/workflows/firmware-wifibt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned build tool
        run: python -m pip install platformio==6.2.0
      - name: Build and check combined firmware
        run: python firmware/jd_wifibt/build.py
      - name: Preserve candidate and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jd-wifibt-candidate
          path: firmware/jd_wifibt/output/
          retention-days: 30
          if-no-files-found: error
