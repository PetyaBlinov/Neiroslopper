board: MKS DLC32 v2.2
name: JD_Plotter_DLC32_V22
meta: Example configuration for MKS DLC32 V2.2, JD-DGUS and 9600 baud DWIN
stepping:
  engine: I2S
  idle_ms: 100
  pulse_us: 4
  dir_delay_us: 2
  disable_delay_us: 0
  segments: 12
uart1:
  txd_pin: gpio.23
  rxd_pin: gpio.33
  rts_pin: NO_PIN
  cts_pin: NO_PIN
  baud: 9600
  mode: 8N1
  passthrough_baud: 0
  passthrough_mode: 8E1
i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17
  min_pulse_us: 2
  oe_pin: NO_PIN
spi:
  miso_pin: NO_PIN
  mosi_pin: NO_PIN
  sck_pin: NO_PIN
sdcard:
  cs_pin: NO_PIN
  card_detect_pin: NO_PIN
  frequency_hz: 8000000
kinematics:
  Cartesian: null
axes:
  shared_stepper_disable_pin: I2SO.0
  shared_stepper_reset_pin: NO_PIN
  homing_runs: 2
  X:
    steps_per_mm: 80.0
    max_rate_mm_per_min: 300.0
    acceleration_mm_per_sec2: 10.0
    max_travel_mm: 1000.0
    soft_limits: false
    idle_disable: true
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.0
      stepstick:
        step_pin: I2SO.5
        direction_pin: I2SO.6
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
        reset_pin: NO_PIN
  Y:
    steps_per_mm: 80.0
    max_rate_mm_per_min: 300.0
    acceleration_mm_per_sec2: 10.0
    max_travel_mm: 1000.0
    soft_limits: false
    idle_disable: true
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.0
      stepstick:
        step_pin: I2SO.1
        direction_pin: I2SO.2
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
        reset_pin: NO_PIN
    motor1:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.0
      stepstick:
        step_pin: I2SO.3
        direction_pin: I2SO.4:low
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
        reset_pin: NO_PIN
  Z:
    steps_per_mm: 80.0
    max_rate_mm_per_min: 1000.0
    acceleration_mm_per_sec2: 25.0
    max_travel_mm: 1000.0
    soft_limits: false
    idle_disable: true
    motor0:
      limit_neg_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.0
      null_motor: null
control:
  safety_door_pin: NO_PIN
  reset_pin: NO_PIN
  feed_hold_pin: NO_PIN
  cycle_start_pin: NO_PIN
  macro0_pin: NO_PIN
  macro1_pin: NO_PIN
  macro2_pin: NO_PIN
  macro3_pin: NO_PIN
  fault_pin: NO_PIN
  estop_pin: NO_PIN
  homing_button_pin: NO_PIN
  single_block_pin: NO_PIN
coolant:
  flood_pin: gpio.32:low
  mist_pin: NO_PIN
  delay_ms: 0
probe:
  pin: NO_PIN
  toolsetter_pin: NO_PIN
  check_mode_start: true
  hard_stop: false
  probe_hard_limit: false
macros:
  startup_line0: null
  startup_line1: null
  Macro0: null
  Macro1: null
  Macro2: null
  Macro3: null
  after_homing: null
  after_reset: null
  after_unlock: null
start:
  must_home: false
  deactivate_parking: true
  check_limits: false
parking:
  enable: false
  axis: Z
  target_mpos_mm: -5.0
  rate_mm_per_min: 800.0
  pullout_distance_mm: 5.0
  pullout_rate_mm_per_min: 250.0
user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN
user_inputs:
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
arc_tolerance_mm: 0.002
junction_deviation_mm: 0.01
verbose_errors: true
report_inches: false
enable_parking_override_control: false
planner_blocks: 16
NoSpindle: null
use_line_numbers: false
